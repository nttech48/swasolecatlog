<style>
  :root{

    --blush:#F0E6D8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---- Header / Hero ---- */
  .site-header{
    padding:52px 32px 36px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:

      var(--ivory);
  }
  .wordmark{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(42px, 7vw, 64px);
    letter-spacing:0.01em;
    margin:0;
    color:var(--ink);
  }
  .wordmark em{
    font-style:italic;
    color:var(--gold-deep);
  }
  .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:20px;
    color:var(--ink-soft);
    margin:10px 0 22px;
  }
  .currency-note{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--gold-deep);
    background:var(--blush);
    border:1px solid var(--line);
    padding:8px 16px;
    border-radius:999px;
  }
  .currency-note b{font-weight:600;}

  /* ---- Controls ---- */
  .controls{
    max-width:1160px;
    margin:0 auto;
    padding:28px 32px 0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab{
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    letter-spacing:0.01em;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .tab:hover{border-color:var(--gold);}
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--ivory);
  }
  .search-wrap{
    position:relative;
    min-width:220px;
  }
  .search-wrap input{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    padding:10px 14px 10px 36px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--gold);}
  .search-wrap svg{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    color:var(--ink-soft);
  }

  .count-row{
    max-width:1160px;
    margin:18px auto 0;
    padding:0 32px;
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---- Grid ---- */
  .grid{
    max-width:1160px;
    margin:0 auto;
    padding:20px 32px 64px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:22px;
  }

  .card{

    display:flex;
    flex-direction:column;
    cursor:pointer;
    transition:border-color .15s ease;

  .card:hover{ border-color:var(--gold); }

    height:100%;

  }

    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }
  .card-price .curr{

    color:var(--ink-soft);

    padding:28px 20px 40px;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }

  /* ---- Product detail modal ---- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(30,26,20,0.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:1000;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--card);
    max-width:920px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:8px;
    display:grid;
    grid-template-columns:1fr 1fr;
    position:relative;
  }
  @media (max-width:720px){
    .modal{ grid-template-columns:1fr; max-height:92vh; }
  }
  .modal-img{
    background:var(--blush);

  }
  .modal-img img{
    width:100%;
    height:100%;
    max-height:88vh;
    object-fit:cover;
    display:block;
  }
  @media (max-width:720px){
    .modal-img img{ max-height:340px; }
  }
  .modal-body{
    padding:34px 32px;
    display:flex;
    flex-direction:column;
  }
  .modal-cat{
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--gold-deep);
  }
  .modal-title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    line-height:1.2;
    margin:6px 0 4px;
    color:var(--ink);
  }
  .modal-price{
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    margin:6px 0 4px;
  }
  .modal-inr{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .modal-desc{
    font-size:14.5px;

    flex-wrap:wrap;
    gap:6px;
    margin-top:auto;
    padding-top:14px;
    border-top:1px solid var(--line);

  .modal-tag{
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--blush);
    border-radius:999px;
    padding:5px 12px;
  }
  .modal-sku{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:12px;
  }
  .modal-close{
    position:absolute;
    top:16px;
    right:16px;
    width:36px;
    height:36px;

    color:var(--ink);

    line-height:1;

    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .modal-close:hover{ border-color:var(--gold); }
</style>
</head>

function formatIDR(n){
  return 'Rp ' + n.toLocaleString('id-ID');
}

function escapeHTML(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

const categories = ['All', ...Array.from(new Set(PRODUCTS.map(p => p.category))).sort()];
let activeCategory = 'All';
let searchTerm = '';

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');

function renderTabs(){
  tabsEl.innerHTML = categories.map(cat => {
    const n = cat === 'All' ? PRODUCTS.length : PRODUCTS.filter(p => p.category === cat).length;
    return `<button class="tab${cat === activeCategory ? ' active' : ''}" data-cat="${escapeHTML(cat)}">${escapeHTML(cat)} <span style="opacity:.55">(${n})</span></button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.getAttribute('data-cat');
      renderTabs();
      renderGrid();
    });
  });
}

function renderGrid(){
  const term = searchTerm.trim().toLowerCase();
  const filtered = PRODUCTS.filter(p => {
    const catOk = activeCategory === 'All' || p.category === activeCategory;
    const searchOk = !term || p.title.toLowerCase().includes(term) || p.category.toLowerCase().includes(term);
    return catOk && searchOk;
  });

  countEl.textContent = `Showing ${filtered.length} of ${PRODUCTS.length} pieces`;
  emptyEl.style.display = filtered.length ? 'none' : 'block';

  gridEl.innerHTML = filtered.map(p => `
    <div class="card" data-handle="${escapeHTML(p.handle)}">
      <div class="card-img">
        <img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.title)}" loading="lazy">
      </div>
      <div class="card-body">
        <span class="card-cat">${escapeHTML(p.category)}</span>
        <h3 class="card-title">${escapeHTML(p.title)}</h3>
        <div class="card-price"><span class="curr">IDR</span>${formatIDR(p.idr)}</div>
      </div>
    </div>
  `).join('');

  gridEl.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      const handle = el.getAttribute('data-handle');
      const p = PRODUCTS.find(x => x.handle === handle);
      if (p) openModal(p);
    });
  });
}

const modalOverlay = document.getElementById('modalOverlay');
const modalImg = document.getElementById('modalImg');
const modalCat = document.getElementById('modalCat');
const modalTitle = document.getElementById('modalTitle');
const modalPrice = document.getElementById('modalPrice');
const modalInr = document.getElementById('modalInr');
const modalDesc = document.getElementById('modalDesc');
const modalTags = document.getElementById('modalTags');
const modalSku = document.getElementById('modalSku');
const modalClose = document.getElementById('modalClose');

function openModal(p){
  modalImg.src = p.image;
  modalImg.alt = p.title;
  modalCat.textContent = p.category;
  modalTitle.textContent = p.title;
  modalPrice.textContent = formatIDR(p.idr);
  modalInr.textContent = `Base price: ₹${p.inr.toLocaleString('en-IN')} INR`;
  modalDesc.textContent = p.description || '';
  modalDesc.style.display = p.description ? 'block' : 'none';
  modalTags.innerHTML = (p.tags || []).map(t => `<span class="modal-tag">${escapeHTML(t)}</span>`).join('');
  modalTags.style.display = (p.tags && p.tags.length) ? 'flex' : 'none';
  modalSku.textContent = p.sku ? `SKU: ${p.sku}` : '';
  modalSku.style.display = p.sku ? 'block' : 'none';
  modalOverlay.classList.add('open');
}

function closeModal(){
  modalOverlay.classList.remove('open');
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

searchEl.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderGrid();
});

renderTabs();
renderGrid();
</script>
