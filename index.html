<style>
  :root{
    --ivory:#FAF6EF;
    --card:#FFFFFF;
    --line:#E7DFD1;
    --ink:#2B2620;
    --ink-soft:#6B6255;
    --gold:#A6803D;
    --gold-deep:#7C5E2B;
    --plum:#4A3B4E;
    --blush:#F0E6D8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---- Header / Hero ---- */
  .site-header{
    padding:52px 32px 36px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(120% 140% at 50% -20%, rgba(166,128,61,0.10), transparent 60%),
      var(--ivory);
  }
  .wordmark{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(42px, 7vw, 64px);
    letter-spacing:0.01em;
    margin:0;
    color:var(--ink);
  }
  .wordmark em{
    font-style:italic;
    color:var(--gold-deep);
  }
  .tagline{

    font-style:italic;
    font-size:20px;
    color:var(--ink-soft);
    margin:10px 0 22px;
  }
  .currency-note{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--gold-deep);
    background:var(--blush);
    border:1px solid var(--line);
    padding:8px 16px;
    border-radius:999px;
  }
  .currency-note b{font-weight:600;}

  /* ---- Controls ---- */
  .controls{
    max-width:1160px;
    margin:0 auto;
    padding:28px 32px 0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab{
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    letter-spacing:0.01em;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .tab:hover{border-color:var(--gold);}
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--ivory);
  }
  .search-wrap{
    position:relative;
    min-width:220px;
  }
  .search-wrap input{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    padding:10px 14px 10px 36px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--gold);}
  .search-wrap svg{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    color:var(--ink-soft);
  }

  .count-row{
    max-width:1160px;
    margin:18px auto 0;
    padding:0 32px;
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---- Grid ---- */
  .grid{
    max-width:1160px;
    margin:0 auto;
    padding:20px 32px 64px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:22px;
  }
  @media (max-width:980px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:700px){ .grid{grid-template-columns:repeat(2,1fr);} .controls{padding-left:20px;padding-right:20px;} .grid{padding-left:20px;padding-right:20px;} }
  @media (max-width:420px){ .grid{grid-template-columns:1fr 1fr;gap:14px;} }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card-img{
    aspect-ratio:1/1;
    width:100%;
    background:var(--blush);
    overflow:hidden;
    position:relative;
  }
  .card-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .card-body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
  .card-cat{
    font-size:11px;
    color:var(--gold-deep);
    letter-spacing:0.02em;
  }
  .card-title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:19px;
    line-height:1.25;
    margin:0;
    color:var(--ink);
  }
  .card-price{
    margin-top:auto;
    padding-top:8px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }
  .card-price .curr{
    font-size:12px;
    font-weight:500;
    color:var(--ink-soft);
    margin-right:3px;
  }

  .empty-state{
    max-width:1160px;
    margin:0 auto;
    padding:60px 32px;
    text-align:center;
    color:var(--ink-soft);
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    font-style:italic;
    display:none;
  }

  footer{
    text-align:center;
    padding:28px 20px 40px;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
</style>
</head>

function formatIDR(n){
  return 'Rp ' + n.toLocaleString('id-ID');
}

function escapeHTML(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

const categories = ['All', ...Array.from(new Set(PRODUCTS.map(p => p.category))).sort()];
let activeCategory = 'All';
let searchTerm = '';

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');

function renderTabs(){
  tabsEl.innerHTML = categories.map(cat => {
    const n = cat === 'All' ? PRODUCTS.length : PRODUCTS.filter(p => p.category === cat).length;
    return `<button class="tab${cat === activeCategory ? ' active' : ''}" data-cat="${escapeHTML(cat)}">${escapeHTML(cat)} <span style="opacity:.55">(${n})</span></button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.getAttribute('data-cat');
      renderTabs();
      renderGrid();
    });
  });
}

function renderGrid(){
  const term = searchTerm.trim().toLowerCase();
  const filtered = PRODUCTS.filter(p => {
    const catOk = activeCategory === 'All' || p.category === activeCategory;
    const searchOk = !term || p.title.toLowerCase().includes(term) || p.category.toLowerCase().includes(term);
    return catOk && searchOk;
  });

  countEl.textContent = `Showing ${filtered.length} of ${PRODUCTS.length} pieces`;
  emptyEl.style.display = filtered.length ? 'none' : 'block';

  gridEl.innerHTML = filtered.map(p => `
    <div class="card">
      <div class="card-img">
        <img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.title)}" loading="lazy">
      </div>
      <div class="card-body">
        <span class="card-cat">${escapeHTML(p.category)}</span>
        <h3 class="card-title">${escapeHTML(p.title)}</h3>
        <div class="card-price"><span class="curr">IDR</span>${formatIDR(p.idr)}</div>
      </div>
    </div>
  `).join('');
}

searchEl.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderGrid();
});

renderTabs();
renderGrid();
</script>
